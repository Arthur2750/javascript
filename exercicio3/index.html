<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>primeiros passos com DOM</title>
    <style>
        body{
            background-color: rgb(37, 57, 207);
            color: white;
            font: normal 18pt Arial;
        }
    </style>
</head>
<body>
    <h1>Iniciando os estudos de DOM</h1>
    <p>Aqui vai o resultando</p>
    <p>Aprendendo a usar o <strong>DOM</strong> em javascript</p>
    <div id="msg">clique em mim</div>
    <script>
        var p1 = document.getElementsByTagName('p')[1]
        p1.style.color = "blue"
        window.document.write('Esta escrito assim ' + p1.innerText + '<br/>')
        document.write(p1.innerHTML)
        /*
        var d = window.document.getElementById('msg')
        d.style.backgroundColor = "green"
        d.innerText = 'Estou aguardando'*/
        var d = document.getElementsByName('msg')[0]
        d.innerText = 'Ola!'
        var b = document.querySelector('div#msg')//id vc usar # quando classe .
        b.style.color = "blue"
    </script>
</body>
</html>
